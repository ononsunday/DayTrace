[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrace"
version = "1.1.1"
description = "Windows local foreground time tracking and daily journal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials==6.11.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "PyInstaller==6.22.3"]

[project.gui-scripts]
daytrace = "daytrace.app:main"

[tool.setuptools.packages.find]
include = ["daytrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
